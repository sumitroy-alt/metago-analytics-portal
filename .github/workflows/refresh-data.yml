name: Refresh dashboard data

# Reads the live sheets, regenerates app/portal/data.js, and commits it if changed.
# Vercel then auto-redeploys with fresh numbers. Runs hourly + on demand.
on:
  schedule:
    - cron: '0 * * * *'      # every hour (UTC)
  workflow_dispatch: {}

concurrency:
  group: refresh-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Regenerate data.js from the sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PYTHONIOENCODING: utf-8
        run: python scripts/refresh_data.py

      - name: Commit if changed
        run: |
          git config user.name "metago-data-bot"
          git config user.email "bot@metago.health"
          git add app/portal/data.js
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: refresh dashboard data [skip ci]"
            git push
          fi
